name: CI

# Three jobs, the same shape as the other BotMaker library repos: `build` on every push and PR, `release`
# and `jitpack` only on a version tag.
#
# Tests DO run here. They take a second, and what they hold is the behaviour of a gate: PluginValidatorTest
# compiles real plugins with javac and loads them through the real PluginLoader, because every failure the
# seven checks exist to catch is a failure of a real classloader over real bytecode. A mocked StudioPlugin
# would pass through the same code and prove none of it.
#
# BOTH UPSTREAMS ARE BUILT FROM SOURCE, not resolved from JitPack: this repo's pom pins
# ${botmaker.studioapi.version} and ${botmaker.pluginhost.version} to 0.0.0-SNAPSHOT — the version the
# umbrella reactor and a local `mvn install` produce — so there is no published artifact under those
# coordinates to download. botmaker-plugin-host declares the contract `provided`, which is why the contract
# is installed first and separately rather than coming along as a transitive dependency.

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check out botmaker-studio-api
        uses: actions/checkout@v7
        with:
          repository: LiQiyeDev/botmaker-studio-api
          path: .deps/botmaker-studio-api

      - name: Check out botmaker-plugin-host
        uses: actions/checkout@v7
        with:
          repository: LiQiyeDev/botmaker-plugin-host
          path: .deps/botmaker-plugin-host

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # RETRIED — Maven Central answers 429 Too Many Requests to GitHub-hosted runners often enough to have
      # failed a release (botmaker-studio, 2026-09-02). See .github/mvn-retry.sh for why the retry cannot be
      # a Maven flag.
      - name: Install the two upstreams (0.0.0-SNAPSHOT)
        run: |
          source .github/mvn-retry.sh
          mvn_retry mvn -B -f .deps/botmaker-studio-api/pom.xml install -DskipTests
          mvn_retry mvn -B -f .deps/botmaker-plugin-host/pom.xml install -DskipTests

      - name: Build and test
        run: mvn -B verify

      # The one job-level check that is not a unit test: the shaded jar has to actually start. A shade
      # configuration that loses the manifest transformer produces a jar that builds, publishes, and then
      # answers `no main manifest attribute` to the first person who downloads it.
      - name: The executable jar runs
        run: java -jar target/botmaker-cli-0.0.0-SNAPSHOT-all.jar --help

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check out botmaker-studio-api
        uses: actions/checkout@v7
        with:
          repository: LiQiyeDev/botmaker-studio-api
          path: .deps/botmaker-studio-api

      - name: Check out botmaker-plugin-host
        uses: actions/checkout@v7
        with:
          repository: LiQiyeDev/botmaker-plugin-host
          path: .deps/botmaker-plugin-host

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # The asset. Unlike the other library repos, this release carries a file, so the jar has to exist
      # before JReleaser runs — under the name jreleaser.yml expects, which is the part that failed on
      # v0.0.1.
      #
      # SHADE NAMES THE JAR FROM THE POM'S <version>, AND THIS POM'S VERSION IS THE COSMETIC
      # 0.0.0-SNAPSHOT (JitPack overrides a build's own version with the tag; see the umbrella CLAUDE.md).
      # There is no <finalName> renaming it — deliberately, since finalName renames only the MAIN artifact
      # and would produce a mismatched pair. So the shaded jar is ALWAYS botmaker-cli-0.0.0-SNAPSHOT-all.jar
      # whatever the tag says, and jreleaser.yml's asset path used to template the RELEASE version, which
      # this build never produces: `Path does not exist … resolved: target/botmaker-cli-0.0.1-all.jar`.
      #
      # The rename happens HERE rather than in a JReleaser `transform:` so that exactly one name exists
      # from this point on — the one the README's `releases/latest/download/botmaker-cli-all.jar` names.
      # The explicit existence test is what turns a shade config that silently stopped attaching the jar
      # into a red job rather than a release with no asset on it.
      - name: Build the executable jar
        run: |
          source .github/mvn-retry.sh
          mvn_retry mvn -B -f .deps/botmaker-studio-api/pom.xml install -DskipTests
          mvn_retry mvn -B -f .deps/botmaker-plugin-host/pom.xml install -DskipTests
          # The tag reaches the manifest here and nowhere else: ${project.version} is the cosmetic
          # 0.0.0-SNAPSHOT, so without this `botmaker --version` answers "(dev)" on a released package.
          mvn_retry mvn -B package -DskipTests "-Dbotmaker.cli.version=${GITHUB_REF_NAME#v}"
          shaded=target/botmaker-cli-0.0.0-SNAPSHOT-all.jar
          if [ ! -f "$shaded" ]; then
            echo "::error::$shaded was not produced — maven-shade-plugin attached nothing, or the pom's <version> is no longer 0.0.0-SNAPSHOT. jreleaser.yml expects target/botmaker-cli-all.jar." >&2
            ls -la target >&2
            exit 1
          fi
          mv "$shaded" target/botmaker-cli-all.jar

      # rpm + deb from ONE description, and a single Go binary rather than rpmbuild (not on ubuntu-latest),
      # fakeroot, a .spec and a debian/ directory. See packaging/nfpm.yaml for why not jpackage, which is
      # what botmaker-studio uses: it bundles a runtime and generates a desktop entry, and this is a 1 MB
      # noarch jar with a three-line launcher.
      #
      # The names are unversioned, the same rule the jar follows and for the same reason — the Pages
      # repository and `releases/latest/download/...` both need a path that does not move.
      #
      # THE RPM IS SIGNED HERE AND THE DEB IS NOT, which is dnf's rule rather than a choice: `gpgcheck` and
      # `repo_gpgcheck` are two independent switches, the published botmaker.repo sets both, and the second
      # one covers the index while the FIRST covers the package's own header. v0.0.3 shipped an unsigned
      # package under a correctly-signed index and dnf refused the transaction at the last step. apt takes
      # the index chain, so the deb needs nothing. See packaging/nfpm.yaml.
      #
      # The key is written out of the same GPG_PRIVATE_KEY secret the pages job imports — base64 of the
      # armored private key, which is what nfpm's key_file wants directly, so there is no gpg import on
      # this runner. With the secrets absent NFPM_RPM_KEY_FILE stays empty and nfpm builds an unsigned
      # package, which is what a fork's tag build gets.
      - name: Build the rpm and the deb
        env:
          NFPM_VERSION: '2.43.0'
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          NFPM_RPM_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          curl -fsSL -o /tmp/nfpm.tar.gz \
            "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}/nfpm_${NFPM_VERSION}_Linux_x86_64.tar.gz"
          tar -xzf /tmp/nfpm.tar.gz -C /tmp nfpm
          # The tag, not the pom: this pom's <version> is the cosmetic 0.0.0-SNAPSHOT JitPack overrides.
          export BOTMAKER_VERSION="${GITHUB_REF_NAME#v}"
          # The completion script is generated by the command it completes, so it cannot describe a
          # different set of verbs than the jar in the same package. packaging/nfpm.yaml installs it.
          java -jar target/botmaker-cli-all.jar completion > target/botmaker.bash
          bash -n target/botmaker.bash
          export NFPM_RPM_KEY_FILE=""
          if [ -n "$GPG_PRIVATE_KEY" ]; then
            NFPM_RPM_KEY_FILE="${RUNNER_TEMP}/botmaker-signing.asc"
            umask 077
            echo "$GPG_PRIVATE_KEY" | base64 -d > "$NFPM_RPM_KEY_FILE"
            export NFPM_RPM_KEY_FILE
          else
            echo "::warning::GPG_PRIVATE_KEY is unset — building an rpm that dnf will refuse under gpgcheck=1."
          fi
          /tmp/nfpm package -f packaging/nfpm.yaml -p rpm -t target/botmaker.rpm
          /tmp/nfpm package -f packaging/nfpm.yaml -p deb -t target/botmaker.deb
          rm -f "${RUNNER_TEMP}/botmaker-signing.asc"
          ls -la target/botmaker.rpm target/botmaker.deb
          # No post-check that the signature is really on the package: nfpm exits 1 on every way signing can
          # go wrong (`failed to create signatures: … private key checksum failure` for a bad passphrase,
          # `reading PGP key file` for a missing one), so a green step already means a signed rpm. A check
          # with `rpm -qp` would also make this step depend on the rpm tools being present on an Ubuntu
          # runner, which is the thing packaging with nfpm exists to avoid.

      # The packages are what the dnf/apt repositories are built from, on a different runner.
      - name: Upload the packages
        uses: actions/upload-artifact@v7
        with:
          name: linux-packages
          path: |
            target/botmaker.rpm
            target/botmaker.deb
          if-no-files-found: error

      # The SAME script release.sh calls to gate this release (check_changelog). One extractor, two readers
      # in two repositories: a release whose notes come from a different rule than the one that gated it can
      # pass the gate and then publish something else.
      - name: Extract the changelog section
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir -p target
          tools/changelog-section.sh "$version" > target/jreleaser-changelog.md
          echo "JRELEASER_PROJECT_VERSION=$version" >> "$GITHUB_ENV"

      - name: Publish the release
        uses: jreleaser/release-action@v2
        with:
          version: 1.25.0
          arguments: full-release
        env:
          JRELEASER_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # The dnf + apt repositories, so `sudo dnf install botmaker` and `sudo apt-get install botmaker` work and
  # every later release arrives with the rest of the system's updates. Lifted from botmaker-studio's job of
  # the same name; the one difference is that these packages are small enough to host here outright.
  #
  # One-time setup: repo → Settings → Pages → Source = "GitHub Actions". Without it deploy-pages fails.
  pages:
    needs: release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    # Job-level permissions replace the workflow's. deploy-pages needs id-token for its OIDC handshake.
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # Pages allows one deployment at a time; queue rather than cancel, so a release never ends up with the
    # previous tag left live because its own deploy was cancelled by a newer one.
    concurrency:
      group: pages
      cancel-in-progress: false
    env:
      GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
    steps:
      # Only for .github/scripts/build-repo.sh — nothing here is built from source.
      - uses: actions/checkout@v7

      - name: Download the packages
        uses: actions/download-artifact@v8
        with:
          name: linux-packages
          path: artifacts

      # createrepo_c writes the dnf metadata; apt-ftparchive (apt-utils) writes Packages/Release.
      - name: Install repository tools
        run: |
          sudo apt-get update
          sudo apt-get install -y createrepo-c apt-utils

      - name: Import signing key
        if: env.GPG_KEY_ID != ''
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.gnupg && chmod 700 ~/.gnupg
          echo "allow-loopback-pinentry" >> ~/.gnupg/gpg-agent.conf
          gpgconf --reload gpg-agent || true
          echo "$GPG_PRIVATE_KEY" | base64 -d | gpg --batch --import
          echo "BOTMAKER_SIGN=1" >> "$GITHUB_ENV"

      - name: Build dnf + apt repositories
        env:
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: bash .github/scripts/build-repo.sh artifacts site "${GITHUB_REF_NAME}"

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v5

  # JitPack builds the library artifact itself from the pushed tag; this just asks it to start eagerly so
  # the plugin registry's CI doesn't wait on it. No secrets required.
  jitpack:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Trigger JitPack build for ${{ github.ref_name }}
        run: |
          curl -sf "https://jitpack.io/api/builds/com.github.${{ github.repository_owner }}/${{ github.event.repository.name }}/${{ github.ref_name }}" || true
