# One description, two packages: botmaker.rpm and botmaker.deb.
#
# WHY nfpm AND NOT jpackage, WHICH botmaker-studio USES. jpackage's job is to bundle a Java *runtime* with
# an app-image and generate the launcher, desktop entry, icon and MIME registration around it — Studio's
# .rpm is ~240 MB and needs every bit of that, and the same tool has to produce the .msi and .dmg, so one
# packaging model covers all three platforms there. This is a 1 MB noarch jar with a three-line launcher and
# no desktop presence at all. jpackage would still force one runner per target OS (it builds only for its
# host) to produce a package whose contents are three files.
#
# WHY nfpm AND NOT rpmbuild + dpkg-deb. One file describes both formats, and it is a single Go binary in CI
# rather than rpmbuild (absent from ubuntu-latest), fakeroot, a .spec and a debian/ directory — two
# hand-maintained descriptions of one package, which is the arrangement this repository refuses everywhere
# else.
#
# THE VERSION comes from the environment because the pom's <version> is the cosmetic 0.0.0-SNAPSHOT that
# JitPack overrides with the tag; the workflow sets BOTMAKER_VERSION from the tag that triggered it. The
# same rule as jreleaser.yml's: never take a release version from anything in target/.
#
# THE RPM IS SIGNED AND THE DEB IS NOT, and the asymmetry is dnf's rather than a preference.
#
# This file used to sign neither, on the reasoning that the repositories on Pages sign their *indexes*
# (repomd.xml.asc, InRelease), and an index carries the checksum of every package it lists — so a signed
# index is already a signature over the payload. That chain is real, and apt accepts it: apt verifies
# InRelease, and a package whose hash matches the index it just verified is trusted with no signature of
# its own. **dnf does not.** `gpgcheck` and `repo_gpgcheck` are two independent switches — the second is
# the index, the FIRST is the package's own header signature — and botmaker.repo sets both, so dnf
# downloaded a correctly-signed index, matched the checksum, and then refused the transaction with
# "Le paquet n'est pas signé" (v0.0.3, the first real install). The choices were to sign the package or to
# publish gpgcheck=0, and turning a check off to fit a build is the wrong way round.
#
# So: NFPM_RPM_KEY_FILE points at the armored private key the workflow writes out of the GPG_PRIVATE_KEY
# secret, and NFPM_RPM_PASSPHRASE unlocks it. Both unset (a fork, a local build) leaves key_file empty,
# which nfpm reads as "do not sign" — the same tolerance build-repo.sh has, and for the same reason: an
# unsigned dry run is useful, an unsigned release is not.
#
# The deb stays unsigned deliberately. debsigs signatures are not what apt checks — no apt on any
# ordinary system verifies them — so producing one would add a second key handling path to satisfy nothing.
# See .github/scripts/build-repo.sh.

name: botmaker
arch: all
platform: linux
version: ${BOTMAKER_VERSION}
version_schema: none
section: devel
priority: optional
maintainer: LiQiyeDev <bgroisne@proton.me>
description: |
  The botmaker command — create, validate, run and publish BotMaker plugins and bots.
  Four verbs around the plugin platform, and a `bot` noun that creates a bot project and
  publishes it to the gallery as a starting template.
vendor: BotMaker
homepage: https://github.com/BotMakerDev/botmaker-cli
license: CC0-1.0

contents:
  - src: target/botmaker-cli-all.jar
    dst: /usr/share/botmaker/botmaker-cli-all.jar

  - src: packaging/botmaker
    dst: /usr/bin/botmaker
    file_info:
      mode: 0755

  # Tab completion, GENERATED by `botmaker completion` in the release job rather than committed. A
  # checked-in completion script is a third statement of what the options are, beside the parser and the
  # usage text, and it is the one that fails silently: it does not break, it just stops offering a verb
  # somebody added. Same argument that made this program take picocli at all.
  #
  # This path is bash-completion's own, and it is loaded on demand by the command's name — so the file has
  # to be called `botmaker`, not `botmaker.bash`. zsh reads the same script through bashcompinit; there is
  # no separate zsh file, because picocli emits one script and a hand-written second one would drift.
  - src: target/botmaker.bash
    dst: /usr/share/bash-completion/completions/botmaker

  - src: README.md
    dst: /usr/share/doc/botmaker/README.md
  - src: LICENSE
    dst: /usr/share/doc/botmaker/LICENSE

# Separate from `overrides.rpm` below, which is the dependency list: this is the rpm packager's own
# configuration, and signing is the only thing in it.
rpm:
  signature:
    key_file: ${NFPM_RPM_KEY_FILE}

overrides:
  # A JRE, and 25 rather than 21: this module compiles with maven.compiler.release 25 (2026-09-02), so an
  # older runtime answers UnsupportedClassVersionError to the first command anybody runs.
  rpm:
    depends:
      - java-25-openjdk-headless
    recommends:
      # Every verb that resolves anything shells out to `mvn` — deliberately, so the tool answers what the
      # user's own Maven answers. A weak dependency rather than a hard one because `botmaker bot new` and
      # `botmaker bot publish` need no Maven at all, and pulling a build tool onto a machine that only ever
      # publishes a template would be wrong.
      - maven
  deb:
    depends:
      - openjdk-25-jre-headless | java25-runtime-headless
    recommends:
      - maven
